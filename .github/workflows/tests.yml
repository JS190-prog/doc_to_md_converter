name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Heavy/Windows-only deps (paddle, pywin32, tkinter GUI) are not needed:
      # OCR and Office automation are stubbed in the tests.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pymupdf python-docx python-pptx olefile openpyxl xlrd defusedxml numpy
      - name: Run tests
        run: python -m pytest -q
